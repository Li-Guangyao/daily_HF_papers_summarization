name: pipeline

on:
  schedule:                 # GitHub cron is always UTC; 2-6 = Tuesday–Saturday (each run covers the previous workdays, so Saturday picks up Friday)
    - cron: "17 2 * * 2-6"  # main run: 02:17 UTC = 10:17 Beijing
    - cron: "17 8 * * 2-6"  # catch-up: outages, .md 404s, late papers
    - cron: "17 14 * * 2-6"
  workflow_dispatch:
    inputs:
      dates:
        description: "Dates to process, e.g. 2026-10-20 or 2026-10-01..2026-10-21 (empty = previous 2 workdays)"
        required: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60                 # hard stop protects the monthly minutes budget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pipeline.main
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          TIME_BUDGET_MINUTES: ${{ vars.TIME_BUDGET_MINUTES || '45' }}
          DATES: ${{ inputs.dates }}
